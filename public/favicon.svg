<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- THE HOUSE MARK: the terminal prompt on the holo tile — the same tile that leads the side rail and the phone strip.
       The stops are index.css's bright holo gradient. The PNGs beside this file are made from it (scripts/make-brand-assets.mjs). -->
  <defs>
    <linearGradient id="holo" x1="0" y1="0.1" x2="1" y2="0.9">
      <stop offset="0" stop-color="#cfd6e4"/>
      <stop offset="0.16" stop-color="#f4f6fb"/>
      <stop offset="0.32" stop-color="#c2d6f0"/>
      <stop offset="0.48" stop-color="#e4d8f4"/>
      <stop offset="0.62" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#c8d8ec"/>
      <stop offset="0.9" stop-color="#ecdff6"/>
      <stop offset="1" stop-color="#d5dcea"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#holo)"/>
  <path d="M17 21.5 30.5 32 17 42.5" fill="none" stroke="#0a0a0a" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34.5 44.5H48" fill="none" stroke="#0a0a0a" stroke-width="6.5" stroke-linecap="round"/>
</svg>
