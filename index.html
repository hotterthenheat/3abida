  <!-- THE THEME BEFORE THE FIRST PAINT (2026-09-12): the reader's choice is read
       from the same key theme/theme.ts keeps, and the attribute tokens.css
       switches on is set here, synchronously, before any stylesheet resolves —
       a light terminal never flashes dark on load, and the other way round. -->
  <!-- THE LANDING ON A FIRST VISIT (2026-10-03) stands on the machine's own ground, as the landing does once it is up
       (pages/landing/ground.tsx readBase; theme/theme.ts stamps the root the same way) — it opened black on a light
       machine and turned light only once the app had loaded, two seconds in on a phone's connection. The terminal with
       no choice made stays dark. -->
  <script>
    (function () {
      var t = 'dark';
      var c = null;
      try {
        c = localStorage.getItem('slayer_theme');
      } catch (e) {}
      var machine = function () {
        try {
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) {
          return 'dark';
        }
      };
      if (c === 'light' || c === 'dark') t = c;
      else if (c === 'system' || (c == null && location.pathname === '/')) t = machine();
      /* THE TERMINAL IN THE LANDING'S WINDOW (src/embed.ts): the page outside names the theme */
      try {
        if (window.self !== window.top && /[?&]embed\b/.test(location.search)) {
          var m = /[?&]theme=(light|dark)\b/.exec(location.search);
          if (m) t = m[1];
        }
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      /* a phone's browser bar takes the page's ground (the light one below, tokens.css's --canvas; theme.ts keeps it after) */
      if (t === 'light') {
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar) bar.setAttribute('content', '#f1f0ec');
      }
      /* (the landing's first screen is words since v5, 2026-10-05: no picture is asked for ahead of the script — its
         pictures come once the page has loaded, Opening.tsx) */
    })();
  </script>

  <!-- THE GROUND BEFORE ANYTHING LOADS (2026-09-20 — Noah: "a white screen for about 5-7 seconds until my page actually shows").
       The page's ground came from the stylesheet, and in development the stylesheet arrives INSIDE the script — so until the
       whole app had loaded there was nothing but the browser's white. These few lines are in the page itself: the theme's own
       ground from the first frame (the attribute is set just above), so a slow load is never a white one — on a cold dev
       server, and for a visitor on a slow connection once we are live. The mark is for a wait that is REAL: it fades in only
       after 450ms, so a fast load never flickers it, and the app replaces it the moment it mounts (it sits inside #root). The
       two grounds are tokens.css's --canvas for each theme. -->
  <style>
    html { background: #050505; }
    html[data-theme='light'] { background: #f1f0ec; }
    /* THE BOOT REVEAL (Slayer Logo System, 2026-09-30): the wordmark types in at 28 ms a character and the cursor lands —
       only on a wait that is real (after 450ms), skipped if the app mounts first, the last frame at once under reduced
       motion. The letters are the wordmark's own outlines (src/brand/wordmarkPaths.ts), not a font. */
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; animation: boot-in 0.01s linear 0.45s forwards; --m: #6b7077; --t: #f4f5f7; }
    html[data-theme='light'] #boot { --m: #6b6e75; --t: #0e0f11; }
    #boot .w { position: relative; display: block; width: min(300px, 64vw); aspect-ratio: 464.1 / 48; }
    #boot svg { display: block; width: 97%; height: auto; clip-path: inset(0 100% 0 0); animation: boot-type 448ms steps(1, end) 0.45s forwards; }
    #boot .m { fill: var(--m); }
    #boot .t { fill: var(--t); }
    #boot i { position: absolute; top: 0; left: 97.95%; width: 2.05%; height: 99.6%; background: var(--t); opacity: 0; animation: boot-blink 1.06s steps(1, end) 0.9s infinite; }
    @keyframes boot-in { to { opacity: 1; } }
    @keyframes boot-type{0.00%{clip-path:inset(0 100.00% 0 0)}6.25%{clip-path:inset(0 94.55% 0 0)}12.50%{clip-path:inset(0 88.25% 0 0)}18.75%{clip-path:inset(0 81.95% 0 0)}25.00%{clip-path:inset(0 75.66% 0 0)}31.25%{clip-path:inset(0 69.36% 0 0)}37.50%{clip-path:inset(0 63.06% 0 0)}43.75%{clip-path:inset(0 56.77% 0 0)}50.00%{clip-path:inset(0 50.47% 0 0)}56.25%{clip-path:inset(0 44.17% 0 0)}62.50%{clip-path:inset(0 37.88% 0 0)}68.75%{clip-path:inset(0 31.58% 0 0)}75.00%{clip-path:inset(0 25.28% 0 0)}81.25%{clip-path:inset(0 18.99% 0 0)}87.50%{clip-path:inset(0 12.69% 0 0)}93.75%{clip-path:inset(0 6.39% 0 0)}100.00%{clip-path:inset(0 0.00% 0 0)}}
    @keyframes boot-blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #boot { animation-duration: 0.01s; } #boot svg { animation: none; clip-path: none; } #boot i { animation: none; opacity: 1; } }
  </style>
