[project]
name = "slayer-core"
version = "0.1.0"
description = "Slayer Terminal's engine: the one implementation of the math, imported by the live loop and the replay"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "tzdata>=2024.1", "pyarrow>=17"]  # tzdata: Windows Python ships no zone database, and the futures clock reads America/New_York; pyarrow: the tape is Parquet

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slayer_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
